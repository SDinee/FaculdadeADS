<!doctype html>
<html>
    <form action="/pagina-processa-dados-do-form" method="post">

        <fieldset>
            <legend>Dados Gerais</legend>

            <label for="nome">Nome:</label>
            <input
                type="text"
                id="nome"
                name="nome"
                minlength="3"
                required
            >

            <br><br>

            <label for="data_nascimento">Data de Nascimento:</label>
            <input
                type="date"
                id="data_nascimento"
                name="data_nascimento"
                required
            >

            <br><br>

            <label for="cpf">CPF:</label>
            <input
                type="text"
                id="cpf"
                name="cpf"
                minlength="11"
                maxlength="14"
                required
            >
        </fieldset>

        <fieldset>
            <legend>Endereço</legend>

            <label for="tipo_endereco">Tipo:</label>
            <select id="tipo_endereco" name="tipo_endereco" required>
                <option value="">Selecione</option>
                <option value="rua">Rua</option>
                <option value="estrada">Estrada</option>
                <option value="rodovia">Rodovia</option>
                <option value="outros">Outros</option>
            </select>

            <br><br>

            <label for="logradouro_endereco">Logradouro:</label>
            <input
                type="text"
                id="logradouro_endereco"
                name="logradouro_endereco"
                required
            >

            <br><br>

            <label for="numero_endereco">Número:</label>
            <input
                type="number"
                id="numero_endereco"
                name="numero_endereco"
                required
            >

            <br><br>

            <label for="complemento_endereco">Complemento:</label>
            <input
                type="text"
                id="complemento_endereco"
                name="complemento_endereco"
            >
        </fieldset>

        <fieldset>
            <legend>Fale Conosco</legend>

            <label for="msg">Mensagem:</label>

            <br>

            <textarea
                id="msg"
                name="msg"
                rows="5"
                cols="40"
                required
            ></textarea>
        </fieldset>

        <fieldset>
            <button type="submit">Enviar sua mensagem</button>
            <button type="reset">Limpar o formulário</button>
        </fieldset>

    </form>
</html>
